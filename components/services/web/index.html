<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--hi:#2c2c2e;--text:#fff;--dim:#8e8e93;--accent:#3d8bff;--red:#ff453a;--green:#30d158}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:16px}h1{font-size:28px;margin:8px 4px 4px}h2{font-size:15px;color:var(--dim);font-weight:500;margin:24px 8px 8px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border-radius:18px;padding:6px 16px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hi)}.row:last-child{border:0}
.row label{flex:1}input,select,textarea{background:var(--hi);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit}input[type=text],input[type=password],select{width:55%}
textarea{width:100%;min-height:260px;font:13px monospace}input[type=range]{flex:1}button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer}
button.ghost{background:var(--hi)}button.red{background:var(--red)}.status{color:var(--dim);margin:0 4px}.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--hi);margin:2px;cursor:pointer;user-select:none}.chip.on{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hi);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s}.toast.show{opacity:1}
.fs-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--hi)}.fs-row:last-child{border:0}
.fs-name{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fs-meta{color:var(--dim);font-size:13px;white-space:nowrap}
.icon{background:var(--hi);padding:6px 10px;border-radius:10px;cursor:pointer;user-select:none}.icon.red{background:#3a1715;color:var(--red)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:10px 0}.crumbs span{cursor:pointer;color:var(--accent)}
.bar{height:6px;background:var(--hi);border-radius:3px;overflow:hidden;margin:6px 0}.bar div{height:100%;width:0;background:var(--accent);transition:width .2s}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
</style>
</head>
<body>
<main>
<h1 id="product">Watch</h1>
<p class="status" id="status">...</p>

<h2>Sveglie</h2>
<div class="card" id="alarms"></div>
<div class="card">
 <div class="row"><label>Ora</label><input type="time" id="a_time" value="07:30"></div>
 <div class="row"><label>Nome</label><input type="text" id="a_label" value="Sveglia"></div>
 <div class="row" id="a_days"></div>
 <div class="row"><button onclick="addAlarm()">Aggiungi sveglia</button></div>
</div>

<h2>Wi-Fi</h2>
<div class="card" id="wifi"></div>
<div class="card">
 <div class="row"><button class="ghost" onclick="scanWifi()">Cerca reti</button></div>
 <div id="w_scan"></div>
 <div class="row"><label>Rete</label><input type="text" id="w_ssid"></div>
 <div class="row"><label>Password</label><input type="password" id="w_pass"></div>
 <div class="row"><button onclick="addWifi(true)">Salva e collega</button><button class="ghost" onclick="addWifi(false)">Solo salva</button></div>
 <div class="status" id="w_status"></div>
</div>

<h2>Impostazioni</h2>
<div class="card">
 <div class="row"><label>Luminosità</label><input type="range" min="10" max="255" id="brightness"></div>
 <div class="row"><label>Spegnimento schermo (s)</label><input type="range" min="5" max="120" id="screen_timeout"></div>
 <div class="row"><label>Volume</label><input type="range" min="0" max="100" id="volume"></div>
 <div class="row"><label>Always on display</label><input type="checkbox" id="always_on"></div>
 <div class="row"><label>Tocca per accendere</label><input type="checkbox" id="tap_to_wake"></div>
 <div class="row"><label>Accendi con le notifiche</label><input type="checkbox" id="wake_on_notification"></div>
 <div class="row"><label>Formato 24 ore</label><input type="checkbox" id="time_24h"></div>
 <div class="row"><label>Ora automatica</label><input type="checkbox" id="auto_time"></div>
 <div class="row"><label>Bluetooth</label><input type="checkbox" id="ble"></div>
 <div class="row"><label>Nome Bluetooth</label><input type="text" id="device_name"></div>
 <div class="row"><label>Fuso orario (POSIX)</label><input type="text" id="timezone"></div>
 <div class="row"><button onclick="saveSettings()">Salva</button><button class="ghost" onclick="syncTime()">Ora dal browser</button></div>
</div>


<h2>Scheda SD</h2>
<div class="card">
 <div class="crumbs" id="fs_crumbs"></div>
 <div class="tools">
  <button class="ghost" onclick="fsUp()">&#8593; Su</button>
  <button class="ghost" onclick="fsMkdir()">+ Cartella</button>
  <button class="ghost" onclick="fsNewFile()">+ File</button>
  <label class="icon" style="padding:10px 16px">Carica file<input type="file" id="fs_files" multiple hidden onchange="fsUpload(this.files)"></label>
 </div>
 <div class="bar" id="fs_bar" hidden><div id="fs_bar_fill"></div></div>
 <div class="status" id="fs_info"></div>
 <div id="fs_list"></div>
</div>
<div class="card" id="fs_editor" hidden>
 <div class="row"><label id="fs_edit_name"></label></div>
 <div class="row" style="display:block"><textarea id="fs_text" spellcheck="false"></textarea></div>
 <div class="row"><button onclick="fsSave()">Salva</button><button class="ghost" onclick="fsCloseEditor()">Chiudi</button></div>
</div>

<h2>App esterne</h2>
<div class="card">
 <div class="row"><label>Nome</label><input type="text" id="u_name" placeholder="MiaApp"></div>
 <div class="row"><input type="file" id="u_file" accept=".bin"><button onclick="upload()">Carica .bin</button></div>
</div>

<h2>Aggiornamento firmware</h2>
<div class="card">
 <div class="row"><label>Versione installata</label><b id="fw_ver">-</b></div>
 <div class="row"><input type="file" id="fw_file" accept=".bin"><button onclick="fwUpload()">Installa</button></div>
 <div class="bar" id="fw_bar" hidden><div id="fw_bar_fill"></div></div>
 <div class="status" id="fw_info">Scegli <b>firmware.bin</b> (cartella <b>build</b> del progetto, o dalle release): l'orologio lo verifica, si riavvia e torna da solo alla versione precedente se quella nuova non parte.</div>
 <div class="row"><label>Manifest online (JSON)</label><input type="text" id="update_url" placeholder="https://.../version.json"></div>
 <div class="row"><button class="ghost" onclick="api('/api/settings',{update_url:$('update_url').value}).then(done)">Salva indirizzo</button></div>
</div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const days=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];let dayMask=0x1F;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function api(path,body,raw){const o=body===undefined?{}:{method:'POST',body:raw?body:JSON.stringify(body)};const r=await fetch(path,o);return(r.headers.get('content-type')||'').includes('json')?r.json():r.text()}
function done(r){toast(r.ok?(r.message||'Salvato'):(r.message||'Errore'))}
function drawDays(){$('a_days').innerHTML=days.map((d,i)=>`<span class="chip ${dayMask&(1<<i)?'on':''}" onclick="dayMask^=${1<<i};drawDays()">${d}</span>`).join('')}
function dayText(m){return m==0?'Una volta':m==127?'Ogni giorno':days.filter((d,i)=>m&(1<<i)).join(' ')}
async function load(){
 const s=await api('/api/state');const st=s.settings;
 if(s.product){document.title=s.product;$('product').textContent=s.product}
 $('status').textContent=`Batteria ${s.battery<0?'-':s.battery+'%'}${s.charging?' (in carica)':''} · Wi-Fi ${s.wifi||'access point'} · SD ${s.sd?'ok':'assente'}`;
 for(const k of['brightness','screen_timeout','volume','timezone','device_name','update_url'])$(k).value=st[k]||'';
 $('fw_ver').textContent=s.version||'-';
 for(const k of['always_on','tap_to_wake','wake_on_notification','time_24h','auto_time','ble'])$(k).checked=st[k];
 const al=await api('/api/alarms');$('alarms').innerHTML=al.length?al.map(a=>`<div class="row"><label><b>${String(a.hour).padStart(2,'0')}:${String(a.minute).padStart(2,'0')}</b> ${a.label}<br><small class="status">${dayText(a.days)}</small></label><input type="checkbox" ${a.enabled?'checked':''} onchange="api('/api/alarms',{id:${a.id},enabled:this.checked}).then(done)"><button class="red" onclick="api('/api/alarms',{id:${a.id},delete:true}).then(r=>{done(r);load()})">✕</button></div>`).join(''):'<div class="row status">Nessuna sveglia</div>';
 const w=await api('/api/wifi');$('wifi').innerHTML=w.length?w.map(n=>`<div class="row"><label>${n}</label><button class="red" onclick="api('/api/wifi',{ssid:'${n.replace(/'/g,"\\'")}',delete:true}).then(r=>{done(r);load()})">✕</button></div>`).join(''):'<div class="row status">Nessuna rete salvata</div>';
}
function addAlarm(){const [h,m]=$('a_time').value.split(':').map(Number);api('/api/alarms',{hour:h,minute:m,days:dayMask,label:$('a_label').value,enabled:true}).then(r=>{done(r);load()})}
function addWifi(c){api('/api/wifi',{ssid:$('w_ssid').value,password:$('w_pass').value,connect:c}).then(r=>{done(r);$('w_pass').value='';load();if(c&&r.ok)pollWifi(0)})}
const bars=r=>r>-60?'▂▄▆█':r>-70?'▂▄▆':r>-80?'▂▄':'▂';
async function scanWifi(){$('w_scan').innerHTML='<div class="status">Ricerca (qualche secondo)...</div>';const l=await api('/api/wifi/scan').catch(()=>[]);$('w_scan').innerHTML=l.length?l.map(n=>`<span class="chip" data-s="${esc(n.ssid)}" onclick="$('w_ssid').value=this.dataset.s;$('w_pass').focus()">${n.open?'':'&#128274; '}${esc(n.ssid)} <small>${bars(n.rssi)}</small>${n.known?' ✓':''}</span>`).join(''):'<div class="status">Nessuna rete 2,4 GHz trovata</div>'}
async function pollWifi(n){const s=await api('/api/wifi/status').catch(()=>null);
 if(s)$('w_status').textContent=s.state=='connecting'?`Collegamento a ${s.ssid}... (il telefono può perdere la rete per qualche secondo)`:s.state=='ok'?`Collegato a ${s.ssid} · IP ${s.ip}`:s.state=='failed'?`Non collegato a ${s.ssid}: ${s.reason}`:'';
 else $('w_status').textContent='In attesa che il telefono si ricolleghi...';
 if(n<30&&(!s||s.state=='connecting'))setTimeout(()=>pollWifi(n+1),2000)}
function saveSettings(){const b={};for(const k of['brightness','screen_timeout','volume'])b[k]=+$(k).value;for(const k of['timezone','device_name'])b[k]=$(k).value;for(const k of['always_on','tap_to_wake','wake_on_notification','time_24h','auto_time','ble'])b[k]=$(k).checked;api('/api/settings',b).then(done)}
function syncTime(){api('/api/time',{epoch:Math.floor(Date.now()/1000)}).then(done)}
async function upload(){const f=$('u_file').files[0],n=$('u_name').value.trim();if(!f||!n)return toast('Scegli nome e file');toast('Caricamento...');const r=await fetch('/api/upload?name='+encodeURIComponent(n),{method:'POST',body:f});done(await r.json())}

let cwd='/',editing=null;const TEXT=/\.(txt|json|ini|csv|md|html|htm|cfg|log|m3u|pls)$/i;
const join=(d,n)=>(d.endsWith('/')?d:d+'/')+n;
const enc=p=>encodeURIComponent(p);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function size(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
async function fsLoad(path){
 const r=await fetch('/api/fs/list?path='+enc(path)).then(x=>x.json()).catch(()=>({ok:false,message:'Errore di rete'}));
 if(!r.ok){toast(r.message||'Errore');return}
 cwd=r.path;const parts=cwd.split('/').filter(x=>x);let acc='';
 $('fs_crumbs').innerHTML='<span data-p="/" onclick="fsLoad(this.dataset.p)">SD</span>'+parts.map(p=>{acc+='/'+p;return ' / <span data-p="'+esc(acc)+'" onclick="fsLoad(this.dataset.p)">'+esc(p)+'</span>'}).join('');
 $('fs_info').textContent=`${r.free_mb} MB liberi su ${r.total_mb} MB`;
 const items=r.entries.sort((a,b)=>(b.d-a.d)||a.n.localeCompare(b.n));
 $('fs_list').innerHTML=items.length?items.map((e,i)=>{const p=join(cwd,e.n);return `<div class="fs-row"><span>${e.d?'&#128193;':'&#128196;'}</span>`+
  `<span class="fs-name" onclick="fsOpen(${i})">${esc(e.n)}</span><span class="fs-meta">${e.d?'':size(e.s)}</span>`+
  (e.d?'':`<a class="icon" href="/api/fs/get?path=${enc(p)}&dl=1">&#11015;</a>`)+
  `<span class="icon" onclick="fsRename(${i})">&#9998;</span><span class="icon red" onclick="fsDelete(${i})">&#10005;</span></div>`}).join(''):'<div class="status" style="padding:12px 0">Cartella vuota</div>';
 window.fsItems=items;
}
function fsUp(){if(cwd==='/')return;fsLoad(cwd.substring(0,cwd.lastIndexOf('/'))||'/')}
function fsOpen(i){const e=fsItems[i],p=join(cwd,e.n);if(e.d)fsLoad(p);else if(TEXT.test(e.n)&&e.s<65536)fsEdit(p);else location.href='/api/fs/get?path='+enc(p)+'&dl=1'}
async function fsPost(url){const r=await fetch(url,{method:'POST'}).then(x=>x.json()).catch(()=>({ok:false,message:'Errore di rete'}));done(r);fsLoad(cwd);return r.ok}
function fsMkdir(){const n=prompt('Nome della nuova cartella');if(n)fsPost('/api/fs/mkdir?path='+enc(join(cwd,n.trim())))}
function fsRename(i){const e=fsItems[i],n=prompt('Nuovo nome',e.n);if(n&&n!==e.n)fsPost('/api/fs/rename?from='+enc(join(cwd,e.n))+'&to='+enc(join(cwd,n.trim())))}
function fsDelete(i){const e=fsItems[i];if(confirm((e.d?'Eliminare la cartella "'+e.n+'" e tutto il suo contenuto?':'Eliminare "'+e.n+'"?')))fsPost('/api/fs/delete?path='+enc(join(cwd,e.n)))}
function fsNewFile(){const n=prompt('Nome del nuovo file (es. note.txt)');if(n){editing=join(cwd,n.trim());$('fs_edit_name').textContent=editing;$('fs_text').value='';$('fs_editor').hidden=false;$('fs_text').focus()}}
async function fsEdit(p){const t=await fetch('/api/fs/get?path='+enc(p)).then(x=>x.text());editing=p;$('fs_edit_name').textContent=p;$('fs_text').value=t;$('fs_editor').hidden=false;$('fs_editor').scrollIntoView({behavior:'smooth'})}
async function fsSave(){if(!editing)return;const r=await fetch('/api/fs/put?path='+enc(editing),{method:'POST',body:$('fs_text').value}).then(x=>x.json()).catch(()=>({ok:false}));done(r);fsLoad(cwd)}
function fsCloseEditor(){editing=null;$('fs_editor').hidden=true}
function putFile(path,file,onp){return new Promise(res=>{const x=new XMLHttpRequest();x.open('POST','/api/fs/put?path='+enc(path));
 x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded/e.total)};x.onload=()=>{try{res(JSON.parse(x.responseText))}catch(e){res({ok:false})}};x.onerror=()=>res({ok:false,message:'Errore di rete'});x.send(file)})}
async function fsUpload(files){const list=[...files];if(!list.length)return;$('fs_bar').hidden=false;let ok=0;
 for(let i=0;i<list.length;i++){const f=list[i];$('fs_info').textContent=`Caricamento ${i+1}/${list.length}: ${f.name}`;
  const r=await putFile(join(cwd,f.name),f,p=>{$('fs_bar_fill').style.width=((i+p)/list.length*100)+'%'});if(r.ok)ok++;else toast(f.name+': '+(r.message||'errore'))}
 $('fs_bar').hidden=true;$('fs_bar_fill').style.width='0';$('fs_files').value='';toast(ok+' file caricati');fsLoad(cwd)}
function fwUpload(){const f=$('fw_file').files[0];if(!f)return toast('Scegli il file .bin');const x=new XMLHttpRequest(),t0=Date.now();
 $('fw_bar').hidden=false;$('fw_info').textContent='Invio...';x.open('POST','/api/firmware');
 x.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=e.loaded/e.total,s=(Date.now()-t0)/1000;$('fw_bar_fill').style.width=(p*100)+'%';
  $('fw_info').textContent=`${Math.round(p*100)}% · ${(e.loaded/1024/Math.max(s,.1)).toFixed(0)} KB/s`};
 x.onload=()=>{let r={ok:false};try{r=JSON.parse(x.responseText)}catch(e){}$('fw_info').textContent=r.message||(r.ok?'Fatto':'Errore');
  $('fw_bar').hidden=true;if(r.ok){$('fw_info').textContent='Installato e verificato: l’orologio si riavvia con la nuova versione. Per tornare a questa pagina riapri l’app Web.'}};
 x.onerror=()=>{$('fw_info').textContent='Errore di rete';$('fw_bar').hidden=true};x.send(f)}
drawDays();load();fsLoad('/');
</script>
</body>
</html>
